name: Deploy Ωhmnic

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov moto[all] -r requirements.txt
      - name: Lint with Ruff
        run: |
          ruff check .
      - name: Test with pytest
        run: |
          pytest --cov=src --cov-report=xml
