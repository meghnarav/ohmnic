AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ωhmnic - Battery Telemetry Streaming & Anomaly Detection Pipeline

Resources:
  BatteryTelemetryStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: ohmnic-battery-telemetry
      ShardCount: 2

  VehicleStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ohmnic-vehicle-baselines
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: vehicle_id
          AttributeType: S
      KeySchema:
        - AttributeName: vehicle_id
          KeyType: HASH

  AnomalyProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ohmnic-anomaly-engine
      CodeUri: src/
      Handler: engine.detector.lambda_handler
      Runtime: python3.11
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          STATE_TABLE: !Ref VehicleStateTable
      Events:
        StreamBatch:
          Type: Kinesis
          Properties:
            Stream: !GetAtt BatteryTelemetryStream.Arn
            StartingPosition: LATEST
            BatchSize: 100