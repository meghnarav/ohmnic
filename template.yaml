AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ohmnic - EV Battery Telemetry Streaming & Anomaly Detection Pipeline

Resources:
  BatteryTelemetryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ohmnic-battery-telemetry.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 60

  VehicleStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ohmnic-vehicle-baselines
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: vehicle_id
          AttributeType: S
      KeySchema:
        - AttributeName: vehicle_id
          KeyType: HASH

  AnomalyProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./src
      DockerTag: python3.11-v1
    Properties:
      CodeUri: src/
      PackageType: Image
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          STATE_TABLE: !Ref VehicleStateTable
          GEMINI_API_KEY: 'REPLACE_ME_OR_USE_PARAMETER'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VehicleStateTable
        - S3ReadPolicy:
            BucketName: aws-sam-cli-managed-default-samclisourcebucket-tnpvxs69s5fy
      Events:
        BatchMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt BatteryTelemetryQueue.Arn
            BatchSize: 10
  OhmnicUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ohmnic-users
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  OhmnicUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref OhmnicUserPool
      ClientName: ohmnic-web-client
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

Outputs:
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref OhmnicUserPool
  UserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref OhmnicUserPoolClient
  Region:
    Description: "AWS Region"
    Value: !Ref AWS::Region
