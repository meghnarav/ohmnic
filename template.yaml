AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ohmnic - EV Battery Telemetry Streaming & Anomaly Detection Pipeline

Resources:
  BatteryTelemetryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ohmnic-battery-telemetry.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 60

  VehicleStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ohmnic-vehicle-baselines
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: vehicle_id
          AttributeType: S
      KeySchema:
        - AttributeName: vehicle_id
          KeyType: HASH

  AnomalyProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ohmnic-anomaly-engine
      CodeUri: src/
      Handler: ingestion.handler.lambda_handler
      Runtime: python3.11
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          STATE_TABLE: !Ref VehicleStateTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VehicleStateTable
      Events:
        BatchMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt BatteryTelemetryQueue.Arn
            BatchSize: 10